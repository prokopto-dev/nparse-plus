[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nparseplus-sdk"
# Read from src/nparseplus_sdk/__init__.py (see [tool.hatch.version]) rather
# than duplicated here — the same single-source rule the app follows. A
# literal here would be a second copy (third counting the one uv writes into
# uv.lock), and the version that decides plugin compatibility is the Python
# one: check_compat() is handed nparseplus_sdk.__version__.
dynamic = ["version"]
description = "Plugin SDK for nParse+, the EverQuest Project 1999 log-parsing overlay — the stable contract for third-party addon windows, parsers, and pollers."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
  { name = "ccaldwell" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
keywords = ["everquest", "project1999", "p99", "nparse", "plugin", "sdk", "overlay"]
# NO dependency on nparseplus: plugins run inside the host app, which provides
# the runtime. Modules that need the host (events, ui) import it lazily.
dependencies = [
  "pydantic>=2.7",
  "packaging>=24.0",
]

[project.urls]
Homepage = "https://prokopto-dev.github.io/nparse-plus/"
Documentation = "https://prokopto-dev.github.io/nparse-plus/latest/plugins/"
Source = "https://github.com/prokopto-dev/nparse-plus/tree/master/sdk"
Issues = "https://github.com/prokopto-dev/nparse-plus/issues"
Changelog = "https://github.com/prokopto-dev/nparse-plus/blob/master/CHANGELOG.md"

[project.scripts]
nparseplus-plugin = "nparseplus_sdk.cli:main"

[tool.hatch.version]
path = "src/nparseplus_sdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nparseplus_sdk"]
