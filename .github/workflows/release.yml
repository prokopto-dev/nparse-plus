name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-release tag to package (for example v1.4.0)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # OSTree repo published to GitHub Pages (gh-pages branch) so
  # `flatpak update` works for sideloaded bundle installs too.
  FLATPAK_REPO_URL: https://prokopto-dev.github.io/nparse-plus/repo
  # Signing key fingerprint (public half committed at
  # packaging/flatpak/nparseplus-repo.gpg; private half in the
  # FLATPAK_GPG_PRIVATE_KEY repo secret).
  FLATPAK_GPG_KEY_ID: 8E0BE7F401945E39444ECF38512B0BCC20C269BC

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      # "true" for a beta (#186), consumed by every job below that must not
      # reach a stable user. Decided ONCE, here, so there is a single answer
      # for the whole run rather than a repeated string test per step.
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Tag must match nparseplus.__version__
        # __init__.py is the single source of truth: pyproject's version is
        # dynamic (hatch reads this same file) and uv.lock does not record a
        # version for dynamic packages, so there is nothing else to check.
        #
        # This holds unchanged for a beta: semantic-release writes the SemVer
        # spelling ("2.30.0-beta.1") into the literal and builds the tag from
        # the same string, so the two still match character for character.
        # What does NOT match is the built distribution's metadata — hatchling
        # normalizes that literal to PEP 440 ("2.30.0b1"), so the wheel, the
        # dist-info directory and importlib.metadata.version() all say
        # 2.30.0b1 while the tag and the literal say 2.30.0-beta.1. That is
        # correct and intended: packaging.Version treats the two as equal, and
        # nothing in the app compares those strings literally. Do not "fix" it
        # by making __version__ a metadata lookup — see the spec's comment on
        # copy_metadata for why that lookup fails exactly in a frozen build.
        run: |
          TAG="${RELEASE_TAG#v}"
          grep -q "^__version__ = \"$TAG\"$" src/nparseplus/__init__.py \
            || { echo "::error::tag $TAG != __init__.py __version__"; exit 1; }
      - name: Classify the tag
        id: classify
        # Any SemVer prerelease carries a hyphen after the release segment
        # ("2.30.0-beta.1"); a stable version cannot contain one.
        run: |
          TAG="${RELEASE_TAG#v}"
          case "$TAG" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "$TAG is a prerelease: $PRERELEASE" >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    needs: check-version
    # One DMG per architecture, both built on Apple Silicon. GitHub retired the
    # standard macos-13 Intel runner (x86_64 jobs there hang unscheduled), so the
    # x86_64 build is cross-compiled on the arm64 runner via Rosetta + an x86_64
    # CPython that uv manages. continue-on-error on the x86_64 leg keeps a
    # cross-build hiccup from ever blocking the release (arm64/Windows/Linux);
    # fail-fast off so one arch never cancels the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x86_64
    runs-on: macos-14
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Rosetta (x86_64 cross-build)
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Build .app (${{ matrix.arch }})
        run: |
          set -euxo pipefail
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # Cross-build: an x86_64 interpreter (run via Rosetta) pulls x86_64
            # wheels and makes PyInstaller emit an x86_64 app.
            PY=cpython-3.12-macos-x86_64
            uv python install "$PY"
            uv sync --frozen --group build --python "$PY"
            uv run --python "$PY" pyinstaller packaging/nparseplus.spec --noconfirm
          else
            uv sync --frozen --group build
            uv run pyinstaller packaging/nparseplus.spec --noconfirm
          fi
      - name: Verify architecture
        run: |
          BIN="dist/nParse+.app/Contents/MacOS/nparseplus"
          lipo -archs "$BIN"
          lipo -archs "$BIN" | tr ' ' '\n' | grep -qx "${{ matrix.arch }}" \
            || { echo "::error::built binary is not ${{ matrix.arch }}"; exit 1; }
      - name: Verify bundle version
        # The spec reads __version__ out of the source tree; check_version
        # already proved that equals the tag. This catches the plist silently
        # going stale again (it shipped "0.0.0-dev" through v1.16.1, which
        # makes Finder/Spotlight useless for telling builds apart).
        run: |
          PLIST="dist/nParse+.app/Contents/Info.plist"
          GOT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          echo "CFBundleShortVersionString=$GOT"
          [ "$GOT" = "${RELEASE_TAG#v}" ] \
            || { echo "::error::Info.plist version $GOT != ${RELEASE_TAG#v}"; exit 1; }
      - name: Ad-hoc codesign
        run: codesign --force --deep -s - "dist/nParse+.app"
      - name: Zip the .app (what the updater downloads)
        # ditto, NOT zip: the bundle's signature seals over resource forks and
        # extended attributes, which `zip` drops — the extracted .app would
        # then fail codesign and, on Apple Silicon, refuse to launch at all.
        # The DMG stays the human download; this is the shape code can unpack
        # without hdiutil attach/copy/detach (#75).
        run: |
          set -euxo pipefail
          ditto -c -k --keepParent "dist/nParse+.app" \
            "dist/nParse+-${RELEASE_TAG#v}-macos-${{ matrix.arch }}.zip"
      - name: Verify the extracted .app still passes codesign
        # The guard on the line above: if the zip is ever produced by
        # something that does not preserve the bundle's metadata, this fails
        # here rather than on a user's Mac after an update.
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/zipcheck"
          ditto -x -k "dist/nParse+-${RELEASE_TAG#v}-macos-${{ matrix.arch }}.zip" \
            "$RUNNER_TEMP/zipcheck"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/zipcheck/nParse+.app"
      - name: Build DMG
        run: uv run dmgbuild -s packaging/dmg_settings.py "nParse+" "dist/nParse+-${RELEASE_TAG#v}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          # Artifact names must be unique per matrix leg (upload-artifact@v4);
          # the release job downloads all of them with merge-multiple.
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync dependencies (with build group)
        run: uv sync --frozen --group build
      # Windows only, and deliberately not through the lock: the prebuilt
      # bootloader in PyInstaller's wheel is byte-identical for every
      # PyInstaller user on earth, malware authors ship it too, and that is
      # what heuristic AV engines match on (#122). Compiling it here produces
      # bytes no vendor has fingerprinted. macOS and Linux stay on the wheel —
      # neither is affected, and the macOS bootloader build is byte-reproducible
      # anyway (verified against the published wheel), so rebuilding it there
      # would change nothing.
      #
      # It fails loudly by construction: PyInstaller's build hook raises when
      # waf fails, and the check below refuses a bootloader that still equals
      # the published one. That check is not belt-and-braces — the sdist SHIPS
      # the prebuilt Windows bootloaders, so a source install that does not set
      # PYINSTALLER_COMPILE_BOOTLOADER packages the exact bytes this replaces
      # and looks exactly like success.
      - name: Pin the PyInstaller source distribution from uv.lock
        run: uv run python tools/pyinstaller_source_pin.py requirements -o pyi-source.txt
      - name: Rebuild the PyInstaller bootloader from source
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: >-
          uv pip install --python .venv/Scripts/python.exe
          --no-deps --reinstall-package pyinstaller
          --no-binary pyinstaller --require-hashes -r pyi-source.txt
      - name: Verify the bootloader is not the published one
        shell: pwsh
        run: |
          $pin = (uv run --no-sync python tools/pyinstaller_source_pin.py wheel win_amd64) -split ' '
          if ($pin.Count -ne 2) { Write-Host '::error::could not read the wheel pin'; exit 1 }
          $wheel = Join-Path $env:RUNNER_TEMP 'pyinstaller-stock.zip'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $pin[0] -OutFile $wheel
          $got = (Get-FileHash $wheel -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $pin[1]) {
            Write-Host "::error::stock wheel sha256 $got != $($pin[1]) from uv.lock"
            exit 1
          }
          $stockDir = Join-Path $env:RUNNER_TEMP 'pyinstaller-stock'
          Remove-Item -Recurse -Force $stockDir -ErrorAction SilentlyContinue
          Expand-Archive -Path $wheel -DestinationPath $stockDir
          # console=False in the spec, so the windowed bootloader is the one
          # that ends up as nparseplus.exe.
          $rel = 'PyInstaller/bootloader/Windows-64bit-intel/runw.exe'
          $stock = (Get-FileHash (Join-Path $stockDir $rel) -Algorithm SHA256).Hash.ToLower()
          $built = (Get-FileHash (Join-Path '.venv/Lib/site-packages' $rel) -Algorithm SHA256).Hash.ToLower()
          Write-Host "published runw.exe sha256 $stock"
          Write-Host "built     runw.exe sha256 $built"
          if ($stock -eq $built) {
            Write-Host "::error::bootloader was NOT rebuilt - it is still the published binary"
            exit 1
          }
      - name: Build
        # --no-sync: the bootloader rebuild above replaced the lock's
        # PyInstaller wheel in .venv, and a syncing `uv run` may put it back.
        run: uv run --no-sync pyinstaller packaging/nparseplus.spec --noconfirm
      - name: Verify exe version
        # Same guard as the macOS Info.plist check: the VERSIONINFO resource
        # must carry the tag, not silently go missing again.
        shell: pwsh
        run: |
          $want = $env:RELEASE_TAG -replace '^v', ''
          $got = (Get-Item dist/nparseplus/nparseplus.exe).VersionInfo.ProductVersion
          Write-Host "ProductVersion=$got"
          if ($got -ne $want) {
            Write-Host "::error::exe ProductVersion $got != $want"
            exit 1
          }
      - name: Smoke-test the exe
        # The guard on the rebuilt bootloader: a bootloader we compiled here is
        # exactly the thing that could produce an exe that no longer starts,
        # and console=False means a failing one says nothing on stderr.
        # Two signals, because "still running" alone is weak — a bootloader
        # error pops a message box and keeps the process alive: the app must
        # also have got far enough into run_app() to open its log file, which
        # happens before Qt loads.
        shell: pwsh
        run: |
          $logDir = uv run --no-sync python -c "from platformdirs import user_log_dir; print(user_log_dir('nparseplus'))"
          if (-not $logDir) { Write-Host '::error::could not resolve the log directory'; exit 1 }
          Write-Host "log dir: $logDir"
          Remove-Item -Recurse -Force $logDir -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath dist/nparseplus/nparseplus.exe -PassThru
          Start-Sleep -Seconds 30
          $crash = Join-Path $logDir 'crash.log'
          if (Test-Path $crash) { Write-Host '--- crash.log ---'; Get-Content $crash }
          $log = Join-Path $logDir 'nparseplus.log'
          if (Test-Path $log) { Write-Host '--- nparseplus.log ---'; Get-Content $log }
          if ($p.HasExited) {
            Write-Host "::error::nparseplus.exe exited early (code $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path $log)) {
            Write-Host "::error::nparseplus.exe never opened its log file - it did not reach run_app()"
            exit 1
          }
          if (Test-Path $crash) {
            Write-Host '::error::nparseplus.exe wrote a crash log on startup'
            exit 1
          }
      - name: Zip
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          Compress-Archive -Path dist/nparseplus -DestinationPath "dist/nparseplus-$version-win64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-pushes the flatpak repo to gh-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Sync dependencies (with build group)
        run: uv sync --frozen --group build
      - name: Build
        run: uv run pyinstaller packaging/nparseplus.spec --noconfirm
      - name: Tarball
        run: |
          VERSION="${RELEASE_TAG#v}"
          tar -C dist -czf "dist/nparseplus-$VERSION-linux-x86_64.tar.gz" nparseplus
      - name: Install flatpak-builder
        if: ${{ needs.check-version.outputs.prerelease != 'true' }}
        run: sudo apt-get install -y flatpak flatpak-builder dbus
      - name: Import Flatpak signing key
        if: ${{ needs.check-version.outputs.prerelease != 'true' }}
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          # Regenerate the public key from the secret rather than trusting
          # the checked-out tree: the checkout is at RELEASE_TAG, which may
          # predate the committed key file (and this also keeps the embedded
          # key correct if the key is ever rotated).
          gpg --export "$FLATPAK_GPG_KEY_ID" > packaging/flatpak/nparseplus-repo.gpg
      - name: Install Flatpak runtime
        if: ${{ needs.check-version.outputs.prerelease != 'true' }}
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: Build Flatpak bundle
        if: ${{ needs.check-version.outputs.prerelease != 'true' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          sed -i "s/@VERSION@/$VERSION/; s/@DATE@/$(date -u +%Y-%m-%d)/" \
            packaging/flatpak/io.github.prokopto_dev.nparse_plus.metainfo.xml
          echo "[$(date -u +%H:%M:%S)] flatpak-builder: build + export (~1 min)"
          flatpak-builder --user --force-clean --repo=flatpak-repo \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" flatpak-builddir \
            packaging/flatpak/io.github.prokopto_dev.nparse_plus.yml
          # Sign the repo summary too (what clients verify on update).
          echo "[$(date -u +%H:%M:%S)] build-update-repo: re-sign summary (seconds)"
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY_ID" flatpak-repo
          # --repo-url: installing the bundle configures its origin remote,
          # so `flatpak update` finds future releases without extra setup.
          # --gpg-keys embeds the public key, making that remote VERIFIED.
          echo "[$(date -u +%H:%M:%S)] build-bundle: xz-compressing ~650 MB into" \
            "the .flatpak — SILENT FOR ~5 MINUTES, this is the slow part"
          flatpak build-bundle \
            --repo-url="$FLATPAK_REPO_URL" \
            --gpg-keys=packaging/flatpak/nparseplus-repo.gpg \
            flatpak-repo \
            "dist/nparseplus-$VERSION-linux-x86_64.flatpak" \
            io.github.prokopto_dev.nparse_plus
          echo "[$(date -u +%H:%M:%S)] bundle done"
      - name: Smoke-test Flatpak bundle
        if: ${{ needs.check-version.outputs.prerelease != 'true' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          flatpak install --user -y --noninteractive \
            "dist/nparseplus-$VERSION-linux-x86_64.flatpak"
          # Boot the real app headless inside the sandbox; exit 124 means
          # timeout killed it, i.e. it was still running after 20 s.
          set +e
          dbus-run-session -- timeout 20 flatpak run \
            --env=QT_QPA_PLATFORM=offscreen \
            io.github.prokopto_dev.nparse_plus
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::flatpak app exited early (code $code)"
            exit 1
          fi
      - name: Verify flatpak update wiring
        if: ${{ needs.check-version.outputs.prerelease != 'true' }}
        run: |
          # The bundle install (smoke test above) must have configured an
          # origin remote pointing at the published repo URL...
          flatpak remotes --user -d | tee remotes.txt
          grep -F "$FLATPAK_REPO_URL" remotes.txt \
            || { echo "::error::bundle origin remote is not $FLATPAK_REPO_URL"; exit 1; }
          # ...and the repo we are about to publish must actually serve the
          # app ref with a VALID SIGNATURE (same checks a client's
          # `flatpak update` performs — this fails if signing breaks).
          flatpak remote-add --user \
            --gpg-import=packaging/flatpak/nparseplus-repo.gpg \
            localtest "file://$(pwd)/flatpak-repo"
          flatpak remote-ls --user localtest | tee refs.txt
          grep -F "io.github.prokopto_dev.nparse_plus" refs.txt \
            || { echo "::error::app ref missing from the flatpak repo"; exit 1; }
      - name: Publish flatpak repo to gh-pages
        if: ${{ needs.check-version.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The `if:` above is the gate; this is the backstop, and it is here
          # because this is the single most dangerous step in the file. The
          # gh-pages branch IS the OSTree repo `flatpak update` follows, so a
          # beta published here reaches STABLE Flatpak users — who never opted
          # into anything — and does so through a force-push that cannot be
          # rolled back by re-running an earlier release. A guard that lives
          # only in a YAML expression is one careless edit from silence; this
          # one fails the job.
          case "${RELEASE_TAG#v}" in
            *-*)
              echo "::error::refusing to publish prerelease ${RELEASE_TAG} to gh-pages"
              exit 1
              ;;
          esac
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Seed from the current gh-pages tree so the mike-managed docs
          # (version dirs, versions.json, root index.html redirect) survive
          # the rebuild; only the flatpak-owned paths are replaced.
          if git clone -q --depth 1 --branch gh-pages "$REMOTE" site; then
            rm -rf site/.git site/repo site/nparseplus.flatpakref site/nparseplus.flatpakrepo
          else
            echo "no existing gh-pages branch; starting fresh"
            mkdir site
          fi
          cp -a flatpak-repo site/repo
          touch site/.nojekyll
          # Embedded public key: remote-add from these files verifies with
          # zero flags.
          GPG_KEY_B64=$(base64 -w0 packaging/flatpak/nparseplus-repo.gpg)
          cat > site/nparseplus.flatpakref <<EOF
          [Flatpak Ref]
          Name=io.github.prokopto_dev.nparse_plus
          Branch=master
          Url=$FLATPAK_REPO_URL
          Title=nParse+ (EverQuest P99 overlay)
          IsRuntime=false
          SuggestRemoteName=nparseplus
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          GPGKey=$GPG_KEY_B64
          EOF
          cat > site/nparseplus.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=nParse+
          Url=$FLATPAK_REPO_URL
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          Comment=nParse+ EverQuest P99 log-parsing overlay
          GPGKey=$GPG_KEY_B64
          EOF
          # The site root belongs to mike (index.html redirects to the
          # latest docs). Only write a fallback landing page if docs have
          # never been deployed to this branch.
          if [ ! -f site/index.html ]; then
            cat > site/index.html <<EOF
          <!doctype html><title>nParse+ flatpak repo</title>
          <h1>nParse+ Flatpak repository (${RELEASE_TAG})</h1>
          <p>Docs are not deployed yet. See
          <a href="https://github.com/${GITHUB_REPOSITORY}">the repository</a>.</p>
          EOF
          fi
          # Single-commit orphan branch, force-pushed: the repo is rebuilt
          # from scratch each release (clients pull incrementally anyway —
          # ostree fetches only objects they don't already have), and the
          # branch never accumulates history. The docs tree carried over
          # above rides along in the same single commit; mike only needs
          # tree state, not history, so re-orphaning under it is safe.
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "flatpak repo for ${RELEASE_TAG}"
          git push --force "$REMOTE" gh-pages
      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: dist/*.tar.gz
          if-no-files-found: error
      # Separate from the tarball so it can carry the prerelease guard while
      # `if-no-files-found: error` keeps its teeth for both: a beta publishes
      # no .flatpak at all, so a combined upload would either fail the run or
      # have to stop checking that the artifacts it names actually exist.
      - uses: actions/upload-artifact@v4
        if: ${{ needs.check-version.outputs.prerelease != 'true' }}
        with:
          name: linux-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  # The Debian 12 build. SEPARATE from build-linux on purpose: that job's
  # artifacts are untouched by anything here.
  #
  # Why it exists: PyInstaller does not bundle glibc, so an artifact's glibc
  # floor is its BUILD HOST's. build-linux runs on ubuntu-latest (24.04, glibc
  # 2.39), so its tarball cannot start on Debian 12 (2.36) — the symptom is
  # `version 'GLIBC_2.3x' not found` at exec. Building in a debian:12
  # container puts the floor at bookworm's instead.
  #
  # Why a container and not `runs-on: ubuntu-22.04`: that image begins
  # deprecation 2026-09-17 and is unsupported by 2027-04-17, so pinning it
  # would buy under a year. The container decouples the floor from whatever
  # GitHub's runner image happens to be, permanently.
  #
  # Why debian:12 and not a manylinux image: PySide6 6.11.1's Linux wheels are
  # tagged manylinux_2_34, so the build host needs glibc >= 2.34. That rules
  # out manylinux_2_28 (AlmaLinux 8). Bookworm's 2.36 clears it.
  build-linux-debian12:
    needs: check-version
    runs-on: ubuntu-latest
    container: debian:12
    # Matches the macOS x86_64 leg: a hiccup in this build must never block a
    # release of the artifacts that already worked. The cost is that a release
    # can publish without the .deb — see docs/development/releasing.md.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # First, before checkout: a bare debian:12 has none of this, and
      # actions/checkout silently degrades to a REST tarball without git.
      # No sudo — a container job already runs as root.
      #
      # libxkbfile1 is the one every QtWebEngine binary needs and the one the
      # first Debian build was missing — see the check step below.
      #
      # The long library list is NOT optional padding. PyInstaller bundles
      # whatever `ldd` resolves AT BUILD TIME, and the GitHub runner image
      # carries far more than this base image does. A library that is simply
      # absent is not bundled and the build still SUCCEEDS — the artifact just
      # quietly loses whatever needed it (QtWebEngine, i.e. the Discord
      # overlay, is the casualty: it wants libnss3/libnspr4 and the Chromium
      # X set). The unresolved-library gate below is what makes that loud.
      - name: Container prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils binutils dbus \
            libgl1 libegl1 libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxext6 libxrender1 libxi6 libsm6 libice6 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 \
            libxfixes3 libxtst6 libxkbfile1 libasound2 libcups2 libatk1.0-0 \
            libatk-bridge2.0-0 libatspi2.0-0 libdrm2 libgbm1 libexpat1 \
            libpango-1.0-0 libcairo2 zlib1g
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # Without a suffix this shares build-linux's cache key (same
          # runner.os, same lock hash) across two different glibc lines.
          cache-suffix: debian12
      - name: Sync dependencies (with build group)
        run: |
          # Bookworm ships Python 3.11 and the project needs >=3.12, so uv
          # fetches its own. python-build-standalone targets glibc 2.17, so
          # the interpreter never raises the floor. Explicit, so a download
          # failure reports itself rather than failing inside the sync.
          uv python install 3.12
          uv sync --frozen --group build
      - name: Build
        run: uv run pyinstaller packaging/nparseplus.spec --noconfirm
      - name: Check the bundle's shared-library closure
        run: |
          # The gate on the failure mode described above. Fatal only for the
          # components the app actually needs: PySide6 also ships plugins for
          # Qt modules this app never loads (TIFF, Wayland, GTK theming,
          # PulseAudio), and failing the build on those would just get the
          # check disabled. Those are reported instead — see the script.
          #
          # NOT piped into tee: this step's shell is `sh -e` (dash), which has
          # no pipefail, so a pipeline would report tee's exit status and
          # swallow a fatal result entirely.
          if uv run python packaging/deb/check_bundle.py \
              --dist-dir dist/nparseplus > closure.txt; then
            failed=0
          else
            failed=1
          fi
          cat closure.txt
          cat closure.txt >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
      - name: Measure the glibc floor
        id: glibc
        run: |
          # The floor is a measurement, not a claim: take the highest
          # versioned glibc symbol any bundled ELF asks for. This is what goes
          # into the package's `Depends: libc6 (>= ...)`, so a dependency that
          # raises it fails the build here instead of a user's launch.
          FLOOR=$(find dist/nparseplus -type f \( -name '*.so' -o -name '*.so.*' \
            -o -name nparseplus \) -print0 \
            | xargs -0 -r objdump -T 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          FLOOR="${FLOOR#GLIBC_}"
          : "${FLOOR:=2.36}"
          echo "measured glibc floor: $FLOOR" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(printf '%s\n2.36\n' "$FLOOR" | sort -V | tail -1)" != "2.36" ]; then
            echo "::error::floor $FLOOR exceeds Debian 12's 2.36"
            exit 1
          fi
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the binary
        run: |
          # build-linux never executes its tarball — only the flatpak bundle
          # is booted — so this is new coverage. Exit 124 means `timeout`
          # killed it, i.e. it was still running after 20 s. app.py only fills
          # QT_QPA_PLATFORM when unset, so forcing offscreen is honoured.
          LOG_DIR=$(uv run python -c \
            "from platformdirs import user_log_dir; print(user_log_dir('nparseplus'))")
          echo "log dir: $LOG_DIR"
          # Same as the Windows step: start from nothing, or a log left by an
          # earlier step decides the result instead of this run.
          rm -rf "$LOG_DIR"
          export QT_QPA_PLATFORM=offscreen
          set +e
          dbus-run-session -- timeout 20 dist/nparseplus/nparseplus
          code=$?
          set -e
          # Explicit ifs, not `[ -f x ] && ...`: the runner's shell is
          # `bash -e`, and a short-circuiting && list is a poor thing to bet
          # a build step on.
          if [ -f "$LOG_DIR/nparseplus.log" ]; then
            echo "--- nparseplus.log ---"
            cat "$LOG_DIR/nparseplus.log"
          fi
          if [ -f "$LOG_DIR/crash.log" ]; then
            echo "--- crash.log ---"
            cat "$LOG_DIR/crash.log"
          fi
          if [ "$code" -ne 124 ]; then
            echo "::error::app exited early (code $code)"
            exit 1
          fi
          # "Still running" alone is weak: it must have reached run_app() far
          # enough to open its log, and must not have crashed on the way.
          if [ ! -f "$LOG_DIR/nparseplus.log" ]; then
            echo "::error::app never opened its log file — it did not reach run_app()"
            exit 1
          fi
          if [ -f "$LOG_DIR/crash.log" ]; then
            echo "::error::app wrote a crash log on startup"
            exit 1
          fi
      - name: Build the .deb
        run: |
          uv run python packaging/deb/build_deb.py \
            --dist-dir dist/nparseplus \
            --version "${RELEASE_TAG#v}" \
            --outdir dist \
            --glibc-floor "${{ steps.glibc.outputs.floor }}"
      - uses: actions/upload-artifact@v4
        with:
          # Distinct from linux-builds: the release job downloads every
          # artifact with merge-multiple, and the two must not collide.
          name: linux-deb-debian12
          path: dist/*.deb
          if-no-files-found: error

  # Installs the .deb on a PRISTINE debian:12 and boots it. This is the only
  # thing that validates `Depends:` — the build container has every library
  # installed by hand, so a missing dependency cannot fail there. `apt-get
  # install ./file.deb` (not `dpkg -i`) is the point: apt resolves the
  # declared dependencies from the archive.
  verify-deb-debian12:
    needs: build-linux-debian12
    runs-on: ubuntu-latest
    container: debian:12
    # build-linux-debian12 is continue-on-error, so a failure there still
    # reports success to this job and it fails at download. That is visible
    # and harmless — it is red beside an already-red job.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # Before download-artifact, not after: the node action needs a trust
      # store, and apt needs its lists before it can resolve the package's
      # Depends. dbus is here because a session bus is a desktop given, not
      # something the package should declare.
      - name: Container prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates dbus
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb-debian12
          path: .
      - name: Install through apt
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y ./nparseplus_*.deb
      - name: Boot the installed app
        run: |
          export QT_QPA_PLATFORM=offscreen
          set +e
          dbus-run-session -- timeout 20 /usr/bin/nparseplus
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::installed app exited early (code $code)"
            exit 1
          fi
      - name: Layout assertions
        run: |
          test -x /usr/bin/nparseplus
          test -f /usr/share/applications/io.github.prokopto_dev.nparse_plus.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/io.github.prokopto_dev.nparse_plus.png
          dpkg -s nparseplus | grep -E '^(Version|Architecture|Depends):'

  release:
    needs: [check-version, build-macos, build-windows, build-linux, build-linux-debian12, verify-deb-debian12]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract this version's changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## .*v?" version "([ (]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See the full changelog for v$VERSION." > release-notes.md
          fi
          # Standing footer on every release body: the SmartScreen/antivirus
          # note and how to verify a download (#122). Not changelog material —
          # it is not news about a version — but it is what somebody on the
          # download page needs, so it rides along with each one.
          cat packaging/release-notes-footer.md >> release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*
          body_path: release-notes.md
          # What actually keeps a beta away from stable clients: every
          # nParse+ binary ever released skips a release carrying this flag
          # (updater.check_for_update), so the tier needs no client change to
          # take effect and no migration for anyone already installed. Only a
          # client that has opted into the beta channel looks past it.
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}

  # Versioned docs deploy. Runs after `release` (which needs build-linux), so
  # the flatpak step's orphan force-push of gh-pages has already landed and
  # mike commits on top of it — no race within a release run. The concurrency
  # group is shared with docs-dev.yml to serialize mike pushes.
  docs:
    needs: [check-version, release]
    # Stable only, for two separate reasons. The versioned deploy derives its
    # directory by stripping the last dot-segment, so "2.30.0-beta.1" would
    # publish a permanent "2.30.0-beta" version alongside the real ones and
    # write it into versions.json, where mike has no tidy way to remove it.
    # And it aliases the deploy to `latest`, which is what the docs site
    # serves by default — a beta's docs would become what every reader sees,
    # documenting behaviour no stable release has.
    if: ${{ needs.check-version.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Fetch gh-pages for mike
        run: git fetch origin gh-pages --depth=1
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync docs dependencies
        run: uv sync --frozen --only-group docs
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy versioned docs
        run: |
          VERSION="${RELEASE_TAG#v}"
          DOCS_VERSION="${VERSION%.*}"   # 1.4.1 -> 1.4
          uv run mike deploy --push --update-aliases "$DOCS_VERSION" latest
          uv run mike set-default --push latest
