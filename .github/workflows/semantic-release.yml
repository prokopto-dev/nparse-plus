name: Semantic Release

on:
  # Auto-release on every merge to master: feat/fix/perf commits cut a release,
  # docs/chore/ci merges no-op (no bump) but still run the ruff+pytest gate.
  # Loop-safe: semantic-release pushes its version-bump commit/tag with
  # GITHUB_TOKEN, which does not re-trigger workflows, and that commit is a
  # non-bumping, changelog-excluded chore.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Verify release candidate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Calculate version, update changelog, commit, tag, and push
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          vcs_release: false
          build: false
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Summary
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Released v${{ steps.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No releasable Conventional Commits were found." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Sync uv.lock to the released version
        # semantic-release bumps pyproject.toml and __init__.py but never
        # re-locks, so uv.lock's own `nparseplus` entry keeps the PREVIOUS
        # version. Harmless to the builds (`uv sync --frozen` does not check
        # it — v1.15.0 through v1.16.1 all shipped from a lock that said
        # 1.14.0) but it has been hand-repaired by `chore: sync uv.lock`
        # commits four times now. Do it here instead.
        #
        # This cannot ride along in the release commit itself: PSR v10 is a
        # Docker action, so its build_command runs in a container without uv.
        # A follow-up commit means the TAG still carries the stale lock entry
        # — accepted, since the frozen sync ignores it and the app version
        # comes from __init__.py.
        if: steps.release.outputs.released == 'true'
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock to v${{ steps.release.outputs.version }}"
          # GITHUB_TOKEN pushes do not re-trigger workflows, so this does not
          # loop back into this job (same reasoning as the PSR push above).
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Start platform package build
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "${GITHUB_REF_NAME}" -f tag="${{ steps.release.outputs.tag }}"
