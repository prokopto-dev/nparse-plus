name: Semantic Release

on:
  # Auto-release on every merge to master: feat/fix/perf commits cut a BETA
  # (pyproject configures master with prerelease = true), docs/chore/ci merges
  # no-op (no bump) but still run the ruff+pytest gate. Since #186 a merge no
  # longer ships to every installed client — a prerelease is offered only to
  # clients that opted into the beta channel, and every binary already in the
  # wild ignores prereleases unconditionally.
  #
  # Loop-safe: semantic-release pushes its version-bump commit/tag with
  # GITHUB_TOKEN, which does not re-trigger workflows, and that commit is a
  # non-bumping, changelog-excluded chore.
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      promote:
        description: >-
          Promote the current beta line to a STABLE release
          (2.30.0-beta.3 -> 2.30.0). Everyone is offered it.
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Verify release candidate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      # THE promotion mechanism. semantic-release reads prerelease-ness off the
      # [tool.semantic_release.branches.*] table matching the CURRENT branch
      # name, and offers no flag that forces a stable release on a branch
      # configured for prereleases. `promote-to-stable` is the branch name
      # pyproject configures with prerelease = false, so checking master's
      # commit out under that name is what turns the next version from
      # 2.30.0-beta.4 into 2.30.0 — a finalize, not another bump.
      #
      # Nothing is pushed under this name: the commit and tag land on master in
      # "Land the promotion on master" below, which is what keeps master's
      # __version__ in step with the newest tag. See pyproject for why a
      # long-lived `stable` branch is the wrong shape here.
      - name: Check master out as the promotion branch
        if: ${{ inputs.promote }}
        run: git checkout -b promote-to-stable
      - name: Calculate version, update changelog, commit, tag, and push
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          vcs_release: false
          build: false
          # A promotion pushes by hand, to master, below — never to the
          # ephemeral branch semantic-release is standing on.
          push: ${{ inputs.promote != true }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Land the promotion on master
        if: ${{ inputs.promote && steps.release.outputs.released == 'true' }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          # Refuse to land anything that is still a prerelease: that would mean
          # the branch table did not match and the "promotion" cut another beta,
          # which must not be pushed to master under the banner of a stable.
          case "$TAG" in
            *-*)
              echo "::error::promotion produced $TAG, which is still a prerelease"
              exit 1
              ;;
          esac
          git push origin HEAD:master
          git push origin "$TAG"
      - name: Summary
        run: |
          if [ "${{ steps.release.outputs.released }}" != "true" ]; then
            echo "No releasable Conventional Commits were found." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.release.outputs.is_prerelease }}" = "true" ]; then
            {
              echo "Released **${{ steps.release.outputs.tag }}** on the **beta** channel."
              echo ""
              echo "Stable clients are not offered this. Promote it with"
              echo "\`gh workflow run semantic-release.yml -f promote=true\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released **${{ steps.release.outputs.tag }}** on the **stable** channel — everyone is offered it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Start platform package build
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref master -f tag="${{ steps.release.outputs.tag }}"
