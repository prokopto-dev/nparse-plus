name: Release

# Tag vX.Y.Z (matching PluginMeta.version) to publish a GitHub release with
# the installable zip and its sha256.
#
# Listing the plugin in the nParse+ registry is a separate, authenticated
# POST from this job — see the README. Deliberately not written here: the
# registry publishes a reusable publish-on-tag workflow to call, and writing
# the request twice is how the two versions of it start disagreeing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Rename this when you rename the plugin package directory.
  PLUGIN_DIR: my_nparse_plugin

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK
        run: python -m pip install "nparseplus-sdk>=1.0,<2"

      - name: Validate plugin
        run: nparseplus-plugin validate "$PLUGIN_DIR"

      - name: Check tag matches PluginMeta.version
        run: |
          python - <<'EOF'
          import os, sys
          from nparseplus_sdk.loading import load_plugin_factory

          plugin = load_plugin_factory(os.environ["PLUGIN_DIR"])()
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if plugin.meta.version != tag:
              sys.exit(
                  f"tag v{tag} does not match PluginMeta.version "
                  f"{plugin.meta.version} — bump meta.version and re-tag"
              )
          print(f"ok: {plugin.meta.id} v{tag}")
          EOF

      - name: Build zip (single-root layout the nParse+ installer requires)
        run: |
          zip -r "${PLUGIN_DIR}.zip" "$PLUGIN_DIR" \
            -x "*/__pycache__/*" -x "*.pyc"
          sha256sum "${PLUGIN_DIR}.zip" | tee sha256.txt

      - name: Compose release body
        run: |
          python - <<'EOF'
          import hashlib, os
          from nparseplus_sdk.loading import load_plugin_factory

          plugin_dir = os.environ["PLUGIN_DIR"]
          meta = load_plugin_factory(plugin_dir)().meta
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          url = (
              f"https://github.com/{repo}/releases/download/{tag}/{plugin_dir}.zip"
          )
          digest = hashlib.sha256(open(f"{plugin_dir}.zip", "rb").read()).hexdigest()
          # Every value a registry publish request carries, so following the
          # README is a matter of copying them. The digest is NOT the value
          # that gets published: the registry downloads the artifact and
          # hashes the bytes itself, and yours is the cross-check.
          #
          # min_app_version is conditional because it is optional — and it
          # is here at all because omitting it silently drops a plugin's
          # compatibility floor, so a release that needs a newer nParse+
          # would be offered to older builds that cannot load it.
          body = (
              f"## {meta.name} v{meta.version}\n\n"
              f"Install: nParse+ → Settings → Plugins → *Install from URL* with the "
              f"zip asset below, or from the registry once this release is listed."
              f"\n\n"
              f"- artifact: {url}\n"
              f"- sha256: `{digest}`\n"
              f"- requires_sdk: `{meta.requires_sdk}`\n"
          )
          if meta.min_app_version:
              body += f"- min_app_version: `{meta.min_app_version}`\n"
          open("release-body.md", "w").write(body)
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-body.md \
            "${PLUGIN_DIR}.zip"
